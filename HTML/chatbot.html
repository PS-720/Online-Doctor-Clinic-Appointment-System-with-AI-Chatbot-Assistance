<!-- Chatbot FAB & Popup -->
<div class="chatbot-fab" id="chatbot-fab" title="Chat with Assistant">
    <img class="icons" src="{{basePath}}Assets/Icons/blue-chatbot.svg" alt="Chat">
</div>

<div class="chatbot-popup" id="chatbot-popup">
    <!-- Chat History Sidebar -->
    <div class="chat-history-sidebar" id="chat-history-sidebar">
        <div class="history-header">
            <h3>Chat History</h3>
            <button class="chat-icon-btn" id="close-history-btn" title="Close History">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
        <div class="history-list" id="history-list">
            <div style="padding: 15px; color: var(--cb-neutral-text); font-size: 0.85rem;">Loading history...</div>
        </div>
    </div>

    <div class="chat-resize-handle" id="chat-resize-handle"></div>
    <div class="chat-content-column">
        <div class="chat-header">
            <div class="chat-header-avatar">
                <img src="{{basePath}}Assets/Icons/blue-chatbot.svg" alt="AI" style="width: 24px; height: 24px; margin-top: 2px;">
            </div>
            <div class="chat-header-info">
                <h3>SmartCare Assistant</h3>
                <div class="chat-header-status">
                    <span class="status-dot"></span>
                    <span>Online & Ready</span>
                </div>
            </div>
            <div class="chat-header-actions">
                <button class="chat-icon-btn new-chat-btn" id="new-chat-btn" title="New Chat">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                    </svg>
                </button>
                <button class="chat-icon-btn mode-toggle-btn" id="mode-toggle-btn" title="Pop out as floating window">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 3 21 3 21 9"/>
                        <line x1="21" y1="3" x2="12" y2="12"/>
                        <path d="M10 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/>
                    </svg>
                </button>
                <span class="close-chat" id="close-chat">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </span>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages">
            <!-- Messages go here -->
        </div>


        <div class="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>

        <div class="chat-input-area">
            <input type="text" class="chat-input" placeholder="Type your symptoms...">
            <button class="send-message-btn">
                <img class="icons" src="{{basePath}}Assets/Icons/paper-plane.svg" alt="Send">
            </button>
        </div>
    </div>

    <!-- Floating Window Drag Handles -->
    <div class="float-resize-n" id="float-resize-n"></div>
    <div class="float-resize-s" id="float-resize-s"></div>
    <div class="float-resize-e" id="float-resize-e"></div>
    <div class="float-resize-w" id="float-resize-w"></div>
    <div class="float-resize-nw" id="float-resize-nw"></div>
    <div class="float-resize-ne" id="float-resize-ne"></div>
    <div class="float-resize-se" id="float-resize-se"></div>
    <div class="float-resize-sw" id="float-resize-sw"></div>

    <!-- Custom Delete Confirmation Modal -->
    <div class="cb-modal-overlay" id="cb-delete-modal">
        <div class="cb-modal-content">
            <h4>Delete Conversation</h4>
            <p>Are you sure you want to permanently delete this chat history? This action cannot be undone.</p>
            <div class="cb-modal-actions">
                <button class="cb-btn cb-btn-cancel" id="cb-cancel-delete">Cancel</button>
                <button class="cb-btn cb-btn-danger" id="cb-confirm-delete">Delete</button>
            </div>
        </div>
    </div>
</div>
